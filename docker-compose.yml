name: sso-azure-odic

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sso}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sso_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-sso_learning}
    ports:
      - "${POSTGRES_PUBLISH_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - appnet

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PUBLISH_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - appnet

  be-1-django:
    build:
      context: ./be-1-django
    environment:
      DJANGO_SETTINGS_MODULE: app.settings
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-sso}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sso_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-sso_learning}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-dev-only}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,be-1-django}
      DJANGO_CORS_ORIGINS: ${DJANGO_CORS_ORIGINS:-http://localhost:5171}
      DJANGO_SESSION_COOKIE_SAMESITE: ${DJANGO_SESSION_COOKIE_SAMESITE:-None}
      DJANGO_SESSION_COOKIE_SECURE: ${DJANGO_SESSION_COOKIE_SECURE:-1}
      DJANGO_LOGOUT_REDIRECT_URL: ${DJANGO_LOGOUT_REDIRECT_URL:-http://localhost:5171/}
      ENTRA_POST_LOGOUT_REDIRECT_URI: ${ENTRA_POST_LOGOUT_REDIRECT_URI:-}
      AZURE_AD_TENANT_ID: ${AZURE_AD_TENANT_ID:-}
      AZURE_AD_CLIENT_ID: ${AZURE_AD_CLIENT_ID:-}
      AZURE_AD_CLIENT_SECRET: ${AZURE_AD_CLIENT_SECRET:-}
      OIDC_RP_SCOPES: ${OIDC_RP_SCOPES:-openid email profile offline_access GroupMember.Read.All}
      OIDC_STORE_ACCESS_TOKEN: ${OIDC_STORE_ACCESS_TOKEN:-1}
      OIDC_REDIRECT_ALLOWED_HOSTS: ${OIDC_REDIRECT_ALLOWED_HOSTS:-localhost,localhost:5171,localhost:8001}
      DJANGO_PORT: ${DJANGO_PORT:-8001}
      DJANGO_SESSION_COOKIE_AGE: ${DJANGO_SESSION_COOKIE_AGE:-1209600}
    ports:
      - "${DJANGO_PUBLISH_PORT:-8001}:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - appnet

  be-2-fastapi:
    build:
      context: ./be-2-fastapi
    environment:
      FASTAPI_PORT: ${FASTAPI_PORT:-8002}
      FASTAPI_CORS_ORIGINS: ${FASTAPI_CORS_ORIGINS:-http://localhost:5172}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-sso}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sso_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-sso_learning}
      AZURE_AD_TENANT_ID: ${AZURE_AD_TENANT_ID:-}
      AZURE_AD_CLIENT_ID: ${AZURE_AD_CLIENT_ID:-}
      AZURE_AD_API_AUDIENCE: ${AZURE_AD_API_AUDIENCE:-}
    ports:
      - "${FASTAPI_PUBLISH_PORT:-8002}:8002"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - appnet

  fe-1:
    build:
      context: ./fe-1
    environment:
      VITE_PORT: "5171"
      VITE_API_URL_BE1: ${VITE_API_URL_BE1:-http://localhost:8001}
      VITE_FE2_URL: ${VITE_FE2_URL:-http://localhost:5172}
    ports:
      - "${FE1_PUBLISH_PORT:-5171}:5171"
    depends_on:
      be-1-django:
        condition: service_healthy
    networks:
      - appnet

  fe-2:
    build:
      context: ./fe-2
    environment:
      VITE_PORT: "5172"
      VITE_API_URL_BE2: ${VITE_API_URL_BE2:-http://localhost:8002}
      VITE_AZURE_TENANT_ID: ${AZURE_AD_TENANT_ID:-}
      VITE_AZURE_CLIENT_ID: ${AZURE_AD_CLIENT_ID:-}
      VITE_AZURE_API_SCOPE: ${VITE_AZURE_API_SCOPE:-}
      VITE_FE1_URL: ${VITE_FE1_URL:-http://localhost:5171}
    ports:
      - "${FE2_PUBLISH_PORT:-5172}:5172"
    depends_on:
      be-2-fastapi:
        condition: service_healthy
    networks:
      - appnet

volumes:
  pgdata:

networks:
  appnet:
    driver: bridge
